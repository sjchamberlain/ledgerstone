---
deployment:
  tasks:
    # DEPLOYPATH is the document root Ledgerstone is served from.
    - export DEPLOYPATH=/home/murphserv/public_html/PROJECT-ledgerstone/
    - /bin/mkdir -p $DEPLOYPATH
    # Skip the copy when the git checkout IS the document root (repository
    # path set directly under public_html) — copying a directory onto
    # itself makes `cp` exit non-zero and cPanel would report a failed
    # deploy even though there's nothing to do.
    - |
      if [ "$(pwd -P)" != "$(cd "$DEPLOYPATH" && pwd -P)" ]; then
        /bin/cp -R * .htaccess $DEPLOYPATH
      fi
